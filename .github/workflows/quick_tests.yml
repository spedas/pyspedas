name: quick_tests

run-name: quick_tests (${{ github.event_name == 'workflow_dispatch' && inputs.dependency_policy || 'default' }}, Python ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.14' }})

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dependency_policy:
        description: 'Runtime dependency policy; default uses normal pip installation behavior'
        type: choice
        required: true
        default: default
        options:
          - default
          - latest
          - oldest
      python_version:
        description: 'Python version to test'
        type: choice
        required: true
        default: '3.14'
        options:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'

permissions:
  contents: read

jobs:
  # Build the shared source bundle and wheel once for downstream jobs.
  prepare:
    runs-on: ubuntu-latest
    env:
      DEPENDENCY_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.dependency_policy || 'default' }}
      PYTHON_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.14' }}
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ""
      PIP_CONFIG_FILE: /dev/null
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Build shared artifacts
      run: |
        python -m venv ../.venv
        source ../.venv/bin/activate
        python -m pip install --group setup
        python -m build --no-isolation
        tar --exclude='./.git' --exclude='./dist' --exclude='./build' \
          --exclude='*/__pycache__' -czf "$RUNNER_TEMP/pyspedas-source.tar.gz" .
    - name: Upload prepared source
      uses: actions/upload-artifact@v6
      with:
        name: quick-test-source-${{ env.DEPENDENCY_POLICY }}-py${{ env.PYTHON_VERSION }}
        path: ${{ runner.temp }}/pyspedas-source.tar.gz
    - name: Upload prepared wheel
      uses: actions/upload-artifact@v6
      with:
        name: quick-test-wheel-${{ env.DEPENDENCY_POLICY }}-py${{ env.PYTHON_VERSION }}
        path: dist/*.whl

  # Run quality checks once using the artifacts prepared above.
  quality:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      DEPENDENCY_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.dependency_policy || 'default' }}
      PYTHON_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.14' }}
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ""
      PIP_CONFIG_FILE: /dev/null
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    # Reuse the prepared source instead of checking out the repository again.
    - name: Download prepared source
      uses: actions/download-artifact@v6
      with:
        name: quick-test-source-${{ env.DEPENDENCY_POLICY }}-py${{ env.PYTHON_VERSION }}
        path: source-bundle
    - name: Unpack prepared source
      run: tar -xzf source-bundle/pyspedas-source.tar.gz
    - name: Create quality environment
      run: |
        python -m venv ../.venv
        source ../.venv/bin/activate
        python -m pip install --group lint
    - name: Test dependency policy handling
      run: python -m unittest discover -s .github/scripts/tests -p 'test_quick_test_dependencies.py' -v
    - name: Lint with flake8
      run: |
        source ../.venv/bin/activate
        flake8 . --exclude '*venv*','build' --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=127
        flake8 . --exclude '*venv*','build' --count --exit-zero --max-complexity=10 --statistics --max-line-length=127
    - name: Lint with ruff
      run: |
        source ../.venv/bin/activate
        ruff check . --select=E9,F63,F7,F82 --statistics
        ruff check . --exit-zero --statistics --line-length=127

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DEPENDENCY_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.dependency_policy || 'default' }}
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ""
      PIP_CONFIG_FILE: /dev/null
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    strategy:
      fail-fast: false
      matrix:
        #python-version: [3.5, 3.6, 3.7, 3.8]
        #os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest]
        #os: [ubuntu-latest]
        #os: [windows-latest]
        python-version: ["${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.14' }}"]
        include:
          - test-group: utilities
            test-command: |
              # Show the IP address the test suite is running from (useful for troubleshooting data server access issues)
              echo IP address for this test:
              coverage run -a -m pyspedas.utilities.tests.test_find_ip_address
              echo Starting DOI metadata tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_doi
              echo Starting Zenodo draft client tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_zenodo_draft
              echo Starting utilities download tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_utilities_download
              echo Starting utilities misc tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_utilities_misc
              echo Starting user preferences tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_preferences
              echo Starting utilities URI tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_utilities_download_uri
              echo Starting utilities xdegap tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_xdegap
              echo Starting utilities tplot_math tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_math
              echo Starting utilities interp_nan tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_interp_nan
              echo Starting utilities time_tests tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_utilities_time
              echo Starting utilities libs_tests tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_utilities_libs
              echo Starting tinterpol_mxn tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_tinterpol_mxn
              echo Starting interpolate_rotation tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_interpolate_rotation
          - test-group: tplot
            test-command: |
              echo Starting tplot wildcard tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_utilities_tplot_wildcard
              echo Starting plotting tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_utilities_plot
              echo Starting wrap_label tests at `date`
              coverage run -a -m pyspedas.tplot_tools.MPLPlotter.plot_tests.test_wrap_label
              echo Starting fill_between tests at `date`
              coverage run -a -m pyspedas.tplot_tools.MPLPlotter.plot_tests.test_fill_between
              echo Starting grid and background plot option tests at `date`
              coverage run -a -m pyspedas.tplot_tools.MPLPlotter.plot_tests.test_grid_background_options
              echo Starting orbit plot tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_utilities_tplotxy
              echo Starting orbit plot range tests at `date`
              coverage run -a -m pyspedas.utilities.tests.test_tplotxy_ranges
          - test-group: cotrans
            test-command: |
              echo Starting cotrans quaternion tests at `date`
              coverage run -a -m pyspedas.cotrans_tools.tests.test_quaternions
              echo Starting cotrans tests at `date`
              coverage run -a -m pyspedas.cotrans_tools.tests.test_cotrans
              echo Starting cotrans minvar tests at `date`
              coverage run -a -m pyspedas.cotrans_tools.tests.test_minvar
              echo Starting cotrans fac tests at `date`
              coverage run -a -m pyspedas.cotrans_tools.tests.test_fac
              echo Starting cotrans lmn tests at `date`
              coverage run -a -m pyspedas.cotrans_tools.tests.test_lmn
          - test-group: analysis
            test-command: |
              echo Starting analysis tests at `date`
              coverage run -a -m pyspedas.analysis.tests.test_analysis
              echo Starting analysis wavpol tests at `date`
              coverage run -a -m pyspedas.analysis.tests.test_twavpol
              echo Starting analysis wavelet tests at `date`
              coverage run -a -m pyspedas.analysis.tests.test_wavelet
          - test-group: hapi
            test-command: |
              echo "Starting HAPI TestData tests"
              coverage run -a -m pyspedas.hapi_tools.tests.test_hapi_testdata
          - test-group: themis
            test-command: |
              echo Starting themis tplot_time  tests at `date`
              coverage run -a -m pyspedas.projects.themis.tests.test_themis_tplot_time
              echo Starting themis version tests at `date`
              coverage run -a -m pyspedas.projects.themis.tests.test_themis_versions
              echo Starting themis tests at `date`
              coverage run -a -m pyspedas.projects.themis.tests.test_themis
              echo Starting themis S3 tests at `date`
              coverage run -a -m pyspedas.projects.themis.tests.test_themis_s3
              echo Starting themis_check_args tests at `date`
              coverage run -a -m pyspedas.projects.themis.tests.test_themis_check_args
              echo Starting themis autoload support tests at `date`
              coverage run -a -m pyspedas.projects.themis.tests.test_themis_autoload_support
              echo Starting themis cal_fit tests at `date`
              coverage run -a -m pyspedas.projects.themis.tests.test_themis_cal_fit
              echo Starting themis dsl_cotrans tests at `date`
              coverage run -a -m pyspedas.projects.themis.tests.test_themis_dsl_cotrans
              echo Starting themis lunar_cotrans tests at `date`
              coverage run -a -m pyspedas.projects.themis.tests.test_themis_lunar_cotrans
              echo Starting themis spinmodel tests at `date`
              coverage run -a -m pyspedas.projects.themis.tests.test_themis_spinmodel
              echo Starting themis state tests at `date`
              coverage run -a -m pyspedas.projects.themis.tests.test_themis_state
              echo Starting themis scpot2dens tests at `date`
              coverage run -a -m pyspedas.projects.themis.tests.test_themis_scpot2dens
          - test-group: missions-spdf
            test-command: |
              echo Starting ace tests at `date`
              coverage run -a -m pyspedas.projects.ace.tests.test_ace
              echo Starting barrel tests at `date`
              coverage run -a -m pyspedas.projects.barrel.tests.test_barrel
              echo Starting soho tests at `date`
              coverage run -a -m pyspedas.projects.soho.tests.test_soho
              echo Starting de2 tests at `date`
              coverage run -a -m pyspedas.projects.de2.tests.test_de2
              echo Starting st5 tests at `date`
              coverage run -a -m pyspedas.projects.st5.tests.test_st5
              echo Starting lanl tests at `date`
              coverage run -a -m pyspedas.projects.lanl.tests.test_lanl
              echo Starting cnofs tests at `date`
              coverage run -a -m pyspedas.projects.cnofs.tests.test_cnofs
              echo Starting dmsp tests at `date`
              coverage run -a -m pyspedas.projects.dmsp.tests.test_dmsp
              echo Starting dscovr tests at `date`
              coverage run -a -m pyspedas.projects.dscovr.tests.test_dscovr
              echo Starting csswe tests at `date`
              coverage run -a -m pyspedas.projects.csswe.tests.test_csswe
              echo Starting equator_s tests at `date`
              coverage run -a -m pyspedas.projects.equator_s.tests.test_equator_s
              echo Starting image tests at `date`
              coverage run -a -m pyspedas.projects.image.tests.test_image
              echo Starting psp tests at `date`
              coverage run -a -m pyspedas.projects.psp.tests.test_psp
              echo Starting rbsp tests at `date`
              coverage run -a -m pyspedas.projects.rbsp.tests.test_rbsp
              echo Starting twins tests at `date`
              coverage run -a -m pyspedas.projects.twins.tests.test_twins
              echo Starting wind tests at `date`
              coverage run -a -m pyspedas.projects.wind.tests.test_wind
              echo Starting polar tests at `date`
              coverage run -a -m pyspedas.projects.polar.tests.test_polar
              echo Starting geotail tests at `date`
              coverage run -a -m pyspedas.projects.geotail.tests.test_geotail
              echo Starting fast tests at `date`
              coverage run -a -m pyspedas.projects.fast.tests.test_fast
              echo Starting omni tests at `date`
              coverage run -a -m pyspedas.projects.omni.tests.test_omni
              echo Starting ulysses tests at `date`
              coverage run -a -m pyspedas.projects.ulysses.tests.test_ulysses
              echo Starting solo tests at `date`
              coverage run -a -m pyspedas.projects.solo.tests.test_solo
          - test-group: missions-non-spdf
            test-command: |
              echo Starting swfo tests at `date`
              coverage run -a -m pyspedas.projects.swfo.tests.test_swfo
              echo Starting stereo tests at `date`
              coverage run -a -m pyspedas.projects.stereo.tests.test_stereo
              echo Starting kyoto tests at `date`
              coverage run -a -m pyspedas.projects.kyoto.tests.test_kyoto
              echo Starting swarm tests at `date`
              coverage run -a -m pyspedas.projects.swarm.tests.test_swarm
              # These tests use a DAS2 server at UIowa.
              #echo "Starting galileo tests at $(date)"
              #coverage run -a -m pyspedas.projects.galileo.tests.test_galileo
              #echo "Starting juno tests at $(date)"
              #coverage run -a -m pyspedas.projects.juno.tests.test_juno

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    # Each parallel test job downloads the shared inputs but keeps its own environment.
    - name: Download prepared source
      uses: actions/download-artifact@v6
      with:
        name: quick-test-source-${{ env.DEPENDENCY_POLICY }}-py${{ matrix.python-version }}
        path: source-bundle
    - name: Download prepared wheel
      uses: actions/download-artifact@v6
      with:
        name: quick-test-wheel-${{ env.DEPENDENCY_POLICY }}-py${{ matrix.python-version }}
        path: quick-test-wheel
    - name: Unpack prepared source
      run: tar -xzf source-bundle/pyspedas-source.tar.gz
    - name: Create test and resolver environments
      run: |
        python -m venv ../.venv
        python -m venv "$RUNNER_TEMP/quick-test-tools"
        mkdir -p "$RUNNER_TEMP/quick-test-dependencies"
        # Keep resolver tooling separate so it cannot satisfy test dependencies.
        cat > "$RUNNER_TEMP/pip-bootstrap.txt" <<'REQUIREMENTS'
        pip==26.2.1 --hash=sha256:71138adf1f4ca900cdb7d289c21b7494329f2332b6d85f0e1c42108c0384ed3e
        REQUIREMENTS
        for interpreter in ../.venv/bin/python "$RUNNER_TEMP/quick-test-tools/bin/python"; do
          "$interpreter" -m pip install --require-hashes --no-deps --only-binary=:all: \
            -r "$RUNNER_TEMP/pip-bootstrap.txt"
        done
        cutoff=$(python -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) - timedelta(days=7)).strftime("%Y-%m-%dT%H:%M:%SZ"))')
        "$RUNNER_TEMP/quick-test-tools/bin/python" -m pip install \
        --uploaded-prior-to "$cutoff" --only-final=:all: \
        "pdm<2.30" "hishel[httpx2]>=1.4,<2" uv
    - name: Install dependencies (${{ env.DEPENDENCY_POLICY }})
      run: |
        source ../.venv/bin/activate
        # Use the wheel from prepare and omit lint tools already checked by quality.
        wheel_path=$(find quick-test-wheel -type f -name '*.whl' -print -quit)
        test -n "$wheel_path"
        python .github/scripts/install_quick_test_dependencies.py \
          --policy "$DEPENDENCY_POLICY" \
          --python "$VIRTUAL_ENV/bin/python" \
          --tools-python "$RUNNER_TEMP/quick-test-tools/bin/python" \
          --output-dir "$RUNNER_TEMP/quick-test-dependencies" \
          --skip-lint \
          --wheel-path "$wheel_path"
    - name: Hide the repo copy so imports use site-packages
      run: |
        source ../.venv/bin/activate
        # keep it around for debugging; delete instead if you want the space back
        pwd
        ls -a
        if [ -d pyspedas ]; then mv pyspedas __repo_pyspedas; fi
        ls -a
        ls "$VIRTUAL_ENV"

    - name: Sanity check import location
      shell: bash
      run: |
        source ../.venv/bin/activate
        python - <<'PY'
        import pyspedas, pathlib, sys
        p = pathlib.Path(pyspedas.__file__).resolve()
        print("sys.executable:", sys.executable)
        print("pyspedas import path:", p)
        print("sys.path[0]:", sys.path[0])
        assert "site-packages" in str(p), f"Still importing from repo: {p}"
        PY
    - name: Test with unittest
      env:
        SPEDAS_DATA_DIR: data
        ACE_DATA_DIR: ace_data/
        BARREL_DATA_DIR: barrel_data/
        CLUSTER_DATA_DIR: cluster_data/
        DSC_DATA_DIR: dsc_data/
        CSSWE_DATA_DIR: csswe_data/
        EQUATORS_DATA_DIR: eqs_data/
        FAST_DATA_DIR: fast_data/
        GEOTAIL_DATA_DIR: geotail_data/
        GOES_DATA_DIR: goes_data/
        IMAGE_DATA_DIR: img_data/
        MICA_DATA_DIR: mica_data/
        MMS_DATA_DIR: mms_data/
        OMNI_DATA_DIR: omni_data/
        POES_DATA_DIR: poes_data/
        POLAR_DATA_DIR: polar_data/

        PSP_DATA_DIR: psp_data/
        RBSP_DATA_DIR: rbsp_data/
        SOLO_DATA_DIR: solo_data/
        STEREO_DATA_DIR: stereo_data/
        THM_DATA_DIR: themis_data/
        TWINS_DATA_DIR: twins_data/
        ULY_DATA_DIR: uly_data/
        WIND_DATA_DIR: wind_data/
        LANL_DATA_DIR: lanl_data/
        CNOFS_DATA_DIR: cnofs_data/
        ST5_DATA_DIR: st5_data/
        PYTPLOT_LOGGING_LEVEL: error
      run: |
        source ../.venv/bin/activate
        echo "========================================================="
        # Show the free disk space on this filesystem
        echo "Disk space prior to starting tests:"
        df -h .
        echo "========================================================="
        ${{ matrix.test-command }}
        echo "========================================================="
        # Show the free disk space on this filesystem
        echo "Disk space after all tests:"
        df -h .
        echo "========================================================="        

        echo Done with tests at `date`
    - name: Save coverage data
      if: always()
      run: |
        mkdir -p "$RUNNER_TEMP/quick-test-coverage"
        if [ -f .coverage ]; then
          cp .coverage "$RUNNER_TEMP/quick-test-coverage/.coverage.${{ matrix.test-group }}"
        else
          echo "No coverage data was produced for ${{ matrix.test-group }}" > "$RUNNER_TEMP/quick-test-coverage/README.txt"
        fi
    - name: Upload coverage data
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: quick-test-coverage-${{ env.DEPENDENCY_POLICY }}-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.test-group }}
        path: ${{ runner.temp }}/quick-test-coverage/
        if-no-files-found: warn
    - name: Record installed dependencies
      if: always()
      run: |
        if [ -x ../.venv/bin/python ]; then
          mkdir -p "$RUNNER_TEMP/quick-test-dependencies"
          ../.venv/bin/python -m pip freeze --all > "$RUNNER_TEMP/quick-test-dependencies/freeze.txt"
          ../.venv/bin/python -m pip inspect > "$RUNNER_TEMP/quick-test-dependencies/inspect.json"
        fi
    - name: Upload dependency diagnostics
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: quick-test-dependencies-${{ env.DEPENDENCY_POLICY }}-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.test-group }}
        path: ${{ runner.temp }}/quick-test-dependencies/
        if-no-files-found: warn

  coverage:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.14' }}
    - name: Download coverage data
      uses: actions/download-artifact@v6
      with:
        pattern: quick-test-coverage-*
        path: coverage-data
        merge-multiple: true
    - name: Combine coverage data
      run: |
        python -m pip install coverage
        if compgen -G 'coverage-data/.coverage.*' > /dev/null; then
          python -m coverage combine coverage-data
          python -m coverage report
          python -m coverage xml -o coverage.xml
          python -m coverage html -d htmlcov
        else
          echo "No coverage data was uploaded by the test groups."
          exit 1
        fi
    - name: Upload coverage report
      uses: actions/upload-artifact@v6
      with:
        name: quick-test-coverage-report
        path: |
          coverage.xml
          htmlcov/
