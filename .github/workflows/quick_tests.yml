name: quick_tests

run-name: quick_tests (${{ github.event_name == 'workflow_dispatch' && inputs.dependency_policy || 'default' }}, Python ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.14' }})

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dependency_policy:
        description: 'Runtime dependency policy; default uses normal pip installation behavior'
        type: choice
        required: true
        default: default
        options:
          - default
          - latest
          - oldest
      python_version:
        description: 'Python version to test'
        type: choice
        required: true
        default: '3.14'
        options:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'

permissions:
  contents: read

jobs:
  # Build the shared source bundle and wheel once for downstream jobs.
  prepare:
    runs-on: ubuntu-latest
    env:
      DEPENDENCY_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.dependency_policy || 'default' }}
      PYTHON_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.14' }}
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ""
      PIP_CONFIG_FILE: /dev/null
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Build shared artifacts
      run: |
        python -m venv ../.venv
        source ../.venv/bin/activate
        python -m pip install --group setup
        python -m build --no-isolation
        tar --exclude='./.git' --exclude='./dist' --exclude='./build' \
          --exclude='*/__pycache__' -czf "$RUNNER_TEMP/pyspedas-source.tar.gz" .
    - name: Upload prepared source
      uses: actions/upload-artifact@v6
      with:
        name: quick-test-source-${{ env.DEPENDENCY_POLICY }}-py${{ env.PYTHON_VERSION }}
        path: ${{ runner.temp }}/pyspedas-source.tar.gz
    - name: Upload prepared wheel
      uses: actions/upload-artifact@v6
      with:
        name: quick-test-wheel-${{ env.DEPENDENCY_POLICY }}-py${{ env.PYTHON_VERSION }}
        path: dist/*.whl

  # Run quality checks once using the artifacts prepared above.
  quality:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      DEPENDENCY_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.dependency_policy || 'default' }}
      PYTHON_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.14' }}
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ""
      PIP_CONFIG_FILE: /dev/null
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    # Reuse the prepared source instead of checking out the repository again.
    - name: Download prepared source
      uses: actions/download-artifact@v6
      with:
        name: quick-test-source-${{ env.DEPENDENCY_POLICY }}-py${{ env.PYTHON_VERSION }}
        path: source-bundle
    - name: Unpack prepared source
      run: tar -xzf source-bundle/pyspedas-source.tar.gz
    - name: Create quality environment
      run: |
        python -m venv ../.venv
        source ../.venv/bin/activate
        python -m pip install --group lint
    - name: Test dependency policy handling
      run: python -m unittest discover -s .github/scripts/tests -p 'test_quick_test_dependencies.py' -v
    - name: Lint with flake8
      run: |
        source ../.venv/bin/activate
        flake8 . --exclude '*venv*','build' --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=127
        flake8 . --exclude '*venv*','build' --count --exit-zero --max-complexity=10 --statistics --max-line-length=127
    - name: Lint with ruff
      run: |
        source ../.venv/bin/activate
        ruff check . --select=E9,F63,F7,F82 --statistics
        ruff check . --exit-zero --statistics --line-length=127

  test:
    needs: prepare
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DEPENDENCY_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.dependency_policy || 'default' }}
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ""
      PIP_CONFIG_FILE: /dev/null
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    strategy:
      fail-fast: false
      matrix:
        #python-version: [3.5, 3.6, 3.7, 3.8]
        #os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest]
        #os: [ubuntu-latest]
        #os: [windows-latest]
        python-version: ["${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.14' }}"]
        test-group:
          - utilities
          - tplot
          - cotrans
          - analysis
          - hapi
          - themis
          - themis-s3
          - psp
          - rbsp
          - missions-spdf
          - missions-non-spdf
        include:
          - test-group: utilities
            test-command: |
              # Show the IP address the test suite is running from (useful for troubleshooting data server access issues)
              echo IP address for this test:
              run_test "utilities find_ip_address" pyspedas.utilities.tests.test_find_ip_address
              run_test "DOI metadata" pyspedas.utilities.tests.test_doi
              run_test "Zenodo draft client" pyspedas.utilities.tests.test_zenodo_draft
              run_test "utilities download" pyspedas.utilities.tests.test_utilities_download
              run_test "utilities misc" pyspedas.utilities.tests.test_utilities_misc
              run_test "user preferences" pyspedas.utilities.tests.test_preferences
              run_test "utilities URI" pyspedas.utilities.tests.test_utilities_download_uri
              run_test "utilities xdegap" pyspedas.utilities.tests.test_xdegap
              run_test "utilities tplot_math" pyspedas.utilities.tests.test_math
              run_test "utilities interp_nan" pyspedas.utilities.tests.test_interp_nan
              run_test "utilities time_tests" pyspedas.utilities.tests.test_utilities_time
              run_test "utilities libs_tests" pyspedas.utilities.tests.test_utilities_libs
              run_test "tinterpol_mxn" pyspedas.utilities.tests.test_tinterpol_mxn
              run_test "interpolate_rotation" pyspedas.utilities.tests.test_interpolate_rotation
          - test-group: tplot
            test-command: |
              run_test "tplot wildcard" pyspedas.utilities.tests.test_utilities_tplot_wildcard
              run_test "plotting" pyspedas.utilities.tests.test_utilities_plot
              run_test "wrap_label" pyspedas.tplot_tools.MPLPlotter.plot_tests.test_wrap_label
              run_test "fill_between" pyspedas.tplot_tools.MPLPlotter.plot_tests.test_fill_between
              run_test "grid and background plot options" pyspedas.tplot_tools.MPLPlotter.plot_tests.test_grid_background_options
              run_test "orbit plot" pyspedas.utilities.tests.test_utilities_tplotxy
              run_test "orbit plot ranges" pyspedas.utilities.tests.test_tplotxy_ranges
          - test-group: cotrans
            test-command: |
              run_test "cotrans quaternion" pyspedas.cotrans_tools.tests.test_quaternions
              run_test "cotrans" pyspedas.cotrans_tools.tests.test_cotrans
              run_test "cotrans minvar" pyspedas.cotrans_tools.tests.test_minvar
              run_test "cotrans fac" pyspedas.cotrans_tools.tests.test_fac
              run_test "cotrans lmn" pyspedas.cotrans_tools.tests.test_lmn
          - test-group: analysis
            test-command: |
              run_test "analysis" pyspedas.analysis.tests.test_analysis
              run_test "analysis wavpol" pyspedas.analysis.tests.test_twavpol
              run_test "analysis wavelet" pyspedas.analysis.tests.test_wavelet
          - test-group: hapi
            test-command: |
              run_test "HAPI TestData" pyspedas.hapi_tools.tests.test_hapi_testdata
          - test-group: themis
            test-command: |
              run_test "themis tplot_time" pyspedas.projects.themis.tests.test_themis_tplot_time
              run_test "themis version" pyspedas.projects.themis.tests.test_themis_versions
              run_test "themis" pyspedas.projects.themis.tests.test_themis
              run_test "themis_check_args" pyspedas.projects.themis.tests.test_themis_check_args
              run_test "themis autoload support" pyspedas.projects.themis.tests.test_themis_autoload_support
              run_test "themis cal_fit" pyspedas.projects.themis.tests.test_themis_cal_fit
              run_test "themis dsl_cotrans" pyspedas.projects.themis.tests.test_themis_dsl_cotrans
              run_test "themis lunar_cotrans" pyspedas.projects.themis.tests.test_themis_lunar_cotrans
              run_test "themis spinmodel" pyspedas.projects.themis.tests.test_themis_spinmodel
              run_test "themis state" pyspedas.projects.themis.tests.test_themis_state
              run_test "themis scpot2dens" pyspedas.projects.themis.tests.test_themis_scpot2dens
          - test-group: themis-s3
            test-command: |
              run_test "themis S3" pyspedas.projects.themis.tests.test_themis_s3
          - test-group: psp
            test-command: |
              run_test "psp" pyspedas.projects.psp.tests.test_psp
          - test-group: rbsp
            test-command: |
              run_test "rbsp" pyspedas.projects.rbsp.tests.test_rbsp
          - test-group: missions-spdf
            test-command: |
              run_test "ace" pyspedas.projects.ace.tests.test_ace
              run_test "barrel" pyspedas.projects.barrel.tests.test_barrel
              run_test "soho" pyspedas.projects.soho.tests.test_soho
              run_test "de2" pyspedas.projects.de2.tests.test_de2
              run_test "st5" pyspedas.projects.st5.tests.test_st5
              run_test "lanl" pyspedas.projects.lanl.tests.test_lanl
              run_test "cnofs" pyspedas.projects.cnofs.tests.test_cnofs
              run_test "dmsp" pyspedas.projects.dmsp.tests.test_dmsp
              run_test "dscovr" pyspedas.projects.dscovr.tests.test_dscovr
              run_test "csswe" pyspedas.projects.csswe.tests.test_csswe
              run_test "equator_s" pyspedas.projects.equator_s.tests.test_equator_s
              run_test "image" pyspedas.projects.image.tests.test_image
              run_test "twins" pyspedas.projects.twins.tests.test_twins
              run_test "wind" pyspedas.projects.wind.tests.test_wind
              run_test "polar" pyspedas.projects.polar.tests.test_polar
              run_test "geotail" pyspedas.projects.geotail.tests.test_geotail
              run_test "fast" pyspedas.projects.fast.tests.test_fast
              run_test "omni" pyspedas.projects.omni.tests.test_omni
              run_test "ulysses" pyspedas.projects.ulysses.tests.test_ulysses
              run_test "solo" pyspedas.projects.solo.tests.test_solo
          - test-group: missions-non-spdf
            test-command: |
              run_test "swfo" pyspedas.projects.swfo.tests.test_swfo
              run_test "stereo" pyspedas.projects.stereo.tests.test_stereo
              run_test "kyoto" pyspedas.projects.kyoto.tests.test_kyoto
              run_test "swarm" pyspedas.projects.swarm.tests.test_swarm
              # These tests use a DAS2 server at UIowa.
              #echo "Starting galileo tests at $(date)"
              #coverage run -a -m pyspedas.projects.galileo.tests.test_galileo
              #echo "Starting juno tests at $(date)"
              #coverage run -a -m pyspedas.projects.juno.tests.test_juno

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    # Each parallel test job downloads the shared inputs but keeps its own environment.
    - name: Download prepared source
      uses: actions/download-artifact@v6
      with:
        name: quick-test-source-${{ env.DEPENDENCY_POLICY }}-py${{ matrix.python-version }}
        path: source-bundle
    - name: Download prepared wheel
      uses: actions/download-artifact@v6
      with:
        name: quick-test-wheel-${{ env.DEPENDENCY_POLICY }}-py${{ matrix.python-version }}
        path: quick-test-wheel
    - name: Unpack prepared source
      run: tar -xzf source-bundle/pyspedas-source.tar.gz
    - name: Create test and resolver environments
      run: |
        python -m venv ../.venv
        python -m venv "$RUNNER_TEMP/quick-test-tools"
        mkdir -p "$RUNNER_TEMP/quick-test-dependencies"
        # Keep resolver tooling separate so it cannot satisfy test dependencies.
        cat > "$RUNNER_TEMP/pip-bootstrap.txt" <<'REQUIREMENTS'
        pip==26.2.1 --hash=sha256:71138adf1f4ca900cdb7d289c21b7494329f2332b6d85f0e1c42108c0384ed3e
        REQUIREMENTS
        for interpreter in ../.venv/bin/python "$RUNNER_TEMP/quick-test-tools/bin/python"; do
          "$interpreter" -m pip install --require-hashes --no-deps --only-binary=:all: \
            -r "$RUNNER_TEMP/pip-bootstrap.txt"
        done
        cutoff=$(python -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) - timedelta(days=7)).strftime("%Y-%m-%dT%H:%M:%SZ"))')
        "$RUNNER_TEMP/quick-test-tools/bin/python" -m pip install \
        --uploaded-prior-to "$cutoff" --only-final=:all: \
        "pdm<2.30" "hishel[httpx2]>=1.4,<2" uv
    - name: Install dependencies (${{ env.DEPENDENCY_POLICY }})
      run: |
        source ../.venv/bin/activate
        # Use the wheel from prepare and omit lint tools already checked by quality.
        wheel_path=$(find quick-test-wheel -type f -name '*.whl' -print -quit)
        test -n "$wheel_path"
        python .github/scripts/install_quick_test_dependencies.py \
          --policy "$DEPENDENCY_POLICY" \
          --python "$VIRTUAL_ENV/bin/python" \
          --tools-python "$RUNNER_TEMP/quick-test-tools/bin/python" \
          --output-dir "$RUNNER_TEMP/quick-test-dependencies" \
          --skip-lint \
          --wheel-path "$wheel_path"
    - name: Hide the repo copy so imports use site-packages
      run: |
        source ../.venv/bin/activate
        # keep it around for debugging; delete instead if you want the space back
        pwd
        ls -a
        if [ -d pyspedas ]; then mv pyspedas __repo_pyspedas; fi
        ls -a
        ls "$VIRTUAL_ENV"

    - name: Sanity check import location
      shell: bash
      run: |
        source ../.venv/bin/activate
        python - <<'PY'
        import pyspedas, pathlib, sys
        p = pathlib.Path(pyspedas.__file__).resolve()
        print("sys.executable:", sys.executable)
        print("pyspedas import path:", p)
        print("sys.path[0]:", sys.path[0])
        assert "site-packages" in str(p), f"Still importing from repo: {p}"
        PY
    - name: Test with unittest
      env:
        SPEDAS_DATA_DIR: data
        ACE_DATA_DIR: ace_data/
        BARREL_DATA_DIR: barrel_data/
        CLUSTER_DATA_DIR: cluster_data/
        DSC_DATA_DIR: dsc_data/
        CSSWE_DATA_DIR: csswe_data/
        EQUATORS_DATA_DIR: eqs_data/
        FAST_DATA_DIR: fast_data/
        GEOTAIL_DATA_DIR: geotail_data/
        GOES_DATA_DIR: goes_data/
        IMAGE_DATA_DIR: img_data/
        MICA_DATA_DIR: mica_data/
        MMS_DATA_DIR: mms_data/
        OMNI_DATA_DIR: omni_data/
        POES_DATA_DIR: poes_data/
        POLAR_DATA_DIR: polar_data/

        PSP_DATA_DIR: psp_data/
        RBSP_DATA_DIR: rbsp_data/
        SOLO_DATA_DIR: solo_data/
        STEREO_DATA_DIR: stereo_data/
        THM_DATA_DIR: themis_data/
        TWINS_DATA_DIR: twins_data/
        ULY_DATA_DIR: uly_data/
        WIND_DATA_DIR: wind_data/
        LANL_DATA_DIR: lanl_data/
        CNOFS_DATA_DIR: cnofs_data/
        ST5_DATA_DIR: st5_data/
        PYTPLOT_LOGGING_LEVEL: error
      run: |
        source ../.venv/bin/activate
        # Group each test and annotate failures without duplicating shell logic.
        run_test() {
          local name="$1"
          local module="$2"
          local status
          local result
          local start_time
          local duration

          start_time=$(date +%s)
          echo "::group::$name"
          echo "Starting $name tests at `date`"
          if coverage run -a -m "$module"; then
            status=0
            result="PASS"
          else
            status=$?
            result="FAIL"
          fi
          duration=$(($(date +%s) - start_time))
          printf '| %s | %s | `%s` | %ss |\n' "$result" "$name" "$module" "$duration" >> "$GITHUB_STEP_SUMMARY"
          echo "::endgroup::"
          if [ "$status" -ne 0 ]; then
            echo "::error::Test $name failed"
          fi
          return "$status"
        }
        {
          echo "## Quick-test results: ${{ matrix.test-group }}"
          echo
          echo "| Status | Test | Module | Duration |"
          echo "|---|---|---|---:|"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "========================================================="
        # Show the free disk space on this filesystem
        echo "Disk space prior to starting tests:"
        df -h .
        echo "========================================================="
        ${{ matrix.test-command }}
        echo "========================================================="
        # Show the free disk space on this filesystem
        echo "Disk space after all tests:"
        df -h .
        echo "========================================================="        

        echo Done with tests at `date`
    - name: Save coverage data
      if: always()
      run: |
        mkdir -p "$RUNNER_TEMP/quick-test-coverage"
        if [ -f .coverage ]; then
          cp .coverage "$RUNNER_TEMP/quick-test-coverage/.coverage.${{ matrix.test-group }}"
        else
          echo "No coverage data was produced for ${{ matrix.test-group }}" > "$RUNNER_TEMP/quick-test-coverage/README.txt"
        fi
    - name: Upload coverage data
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: quick-test-coverage-${{ env.DEPENDENCY_POLICY }}-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.test-group }}
        path: ${{ runner.temp }}/quick-test-coverage/
        include-hidden-files: true
        if-no-files-found: warn
    - name: Record installed dependencies
      if: always()
      run: |
        if [ -x ../.venv/bin/python ]; then
          mkdir -p "$RUNNER_TEMP/quick-test-dependencies"
          ../.venv/bin/python -m pip freeze --all > "$RUNNER_TEMP/quick-test-dependencies/freeze.txt"
          ../.venv/bin/python -m pip inspect > "$RUNNER_TEMP/quick-test-dependencies/inspect.json"
        fi
    - name: Upload dependency diagnostics
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: quick-test-dependencies-${{ env.DEPENDENCY_POLICY }}-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.test-group }}
        path: ${{ runner.temp }}/quick-test-dependencies/
        if-no-files-found: warn

  coverage:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.14' }}
    - name: Download prepared source
      uses: actions/download-artifact@v6
      with:
        name: quick-test-source-${{ github.event_name == 'workflow_dispatch' && inputs.dependency_policy || 'default' }}-py${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.14' }}
        path: source-bundle
    - name: Unpack prepared source
      run: tar -xzf source-bundle/pyspedas-source.tar.gz
    - name: Download coverage data
      uses: actions/download-artifact@v6
      with:
        pattern: quick-test-coverage-*
        path: coverage-data
        merge-multiple: true
    - name: Combine coverage data
      run: |
        python -m pip install coverage
        cat > .coveragerc <<'EOF'
        [paths]
        source =
            pyspedas
            */.venv/lib/python*/site-packages/pyspedas
        EOF
        if compgen -G 'coverage-data/.coverage.*' > /dev/null; then
          python -m coverage combine coverage-data
          python -m coverage report
          {
            echo "## Coverage"
            echo
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage xml -o coverage.xml
          python -m coverage html -d htmlcov
        else
          echo "No coverage data was uploaded by the test groups."
          exit 1
        fi
    - name: Upload coverage report
      uses: actions/upload-artifact@v6
      with:
        name: quick-test-coverage-report
        path: |
          coverage.xml
          htmlcov/
