        echo "Disk space after all tests:"
        df -h .
        echo "========================================================="        

        echo Done with tests at `date`
    - name: Record installed packages and the release cutoff
      if: always()
      run: |
        source ../.venv/bin/activate
        python -m pip freeze --all > "$RUNNER_TEMP/latest-dependency-freeze.txt"
        python -m pip inspect > "$RUNNER_TEMP/latest-dependency-inspect.json"
        printf '%s\n' "$PIP_UPLOADED_PRIOR_TO" > "$RUNNER_TEMP/latest-dependency-cutoff.txt"
    - name: Upload dependency diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: latest-dependencies-${{ matrix.os }}-py${{ matrix.python-version }}
        path: ${{ runner.temp }}/latest-dependency-*
        if-no-files-found: warn
