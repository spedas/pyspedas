name: zenodo_draft

on:
  workflow_dispatch:
    inputs:
      concept_id:
        description: "Zenodo concept record ID (leave blank to read Concept_DOI from pyproject.toml)"
        required: false
        type: string
      sandbox:
        description: "Use sandbox.zenodo.org (concept_id is required)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: zenodo-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reserve-doi:
    runs-on: ubuntu-latest
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_API_KEY || secrets.ZENODO_API_TOKEN }}
      ZENODO_SANDBOX_ACCESS_TOKEN: ${{ secrets.ZENODO_SANDBOX_API_KEY || secrets.ZENODO_SANDBOX_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release helpers
        run: python -m pip install 'requests>=2.34,<3' 'tomlkit>=0.13,<1'

      - name: Validate Zenodo credential
        env:
          USE_SANDBOX: ${{ inputs.sandbox }}
        run: |
          token="$ZENODO_ACCESS_TOKEN"
          secret_name="ZENODO_API_KEY"
          if [[ "$USE_SANDBOX" == "true" ]]; then
            token="$ZENODO_SANDBOX_ACCESS_TOKEN"
            secret_name="ZENODO_SANDBOX_API_KEY"
          fi
          if [[ -z "$token" ]]; then
            echo "Repository secret $secret_name is not configured." >&2
            exit 1
          fi
          if [[ "$token" == *$'\n'* || "$token" == *$'\r'* ]]; then
            echo "Repository secret $secret_name contains a newline; save only the raw Zenodo token." >&2
            exit 1
          fi

      - name: Select Zenodo concept
        id: concept
        env:
          REQUESTED_CONCEPT: ${{ inputs.concept_id }}
          USE_SANDBOX: ${{ inputs.sandbox }}
        run: |
          concept="$REQUESTED_CONCEPT"
          if [[ -z "$concept" ]]; then
            if [[ "$USE_SANDBOX" == "true" ]]; then
              echo "concept_id is required when using Zenodo Sandbox" >&2
              exit 1
            fi
            concept_url=$(python scripts/update_project_doi.py --key Concept_DOI)
            concept="${concept_url##*.}"
          fi
          [[ "$concept" =~ ^[0-9]+$ ]] || { echo "Invalid concept record ID" >&2; exit 1; }
          echo "id=$concept" >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft and reserve DOI
        id: draft
        env:
          CONCEPT_ID: ${{ steps.concept.outputs.id }}
          USE_SANDBOX: ${{ inputs.sandbox }}
        run: |
          sandbox_flag=()
          if [[ "$USE_SANDBOX" == "true" ]]; then
            sandbox_flag=(--sandbox)
          fi
          result=$(python pyspedas/utilities/zenodo_draft.py \
            "${sandbox_flag[@]}" reserve --concept "$CONCEPT_ID")
          draft_id=$(jq -er .id <<< "$result")
          doi=$(jq -er .doi <<< "$result")
          draft_url=$(jq -er .url <<< "$result")
          draft_action=$(jq -er .action <<< "$result")

          echo "id=$draft_id" >> "$GITHUB_OUTPUT"
          echo "doi=$doi" >> "$GITHUB_OUTPUT"
          echo "url=$draft_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Zenodo draft"
            echo "${draft_action^} [draft $draft_id]($draft_url) and reserved **$doi**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update versioned DOI
        env:
          DOI: ${{ steps.draft.outputs.doi }}
        run: python scripts/update_project_doi.py --key Versioned_DOI --value "$DOI"

      - name: Commit DOI update
        env:
          DOI: ${{ steps.draft.outputs.doi }}
        run: |
          if git diff --quiet -- pyproject.toml; then
            echo "pyproject.toml already contains $DOI"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Update versioned DOI to $DOI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
