name: zenodo_draft

on:
  workflow_dispatch:
    inputs:
      concept_id:
        description: "Zenodo concept record ID (leave blank to read Concept_DOI from pyproject.toml)"
        required: false
        type: string
      sandbox:
        description: "Use sandbox.zenodo.org (concept_id is required)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: zenodo-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reserve-doi:
    runs-on: ubuntu-latest
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_API_KEY || secrets.ZENODO_API_TOKEN }}
      ZENODO_SANDBOX_ACCESS_TOKEN: ${{ secrets.ZENODO_SANDBOX_API_KEY || secrets.ZENODO_SANDBOX_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release helpers
        run: |
          npm install --global zenodraft@0.14.1
          python -m pip install 'tomlkit>=0.13,<1'

      - name: Validate Zenodo credential
        env:
          USE_SANDBOX: ${{ inputs.sandbox }}
        run: |
          token="$ZENODO_ACCESS_TOKEN"
          secret_name="ZENODO_API_KEY"
          if [[ "$USE_SANDBOX" == "true" ]]; then
            token="$ZENODO_SANDBOX_ACCESS_TOKEN"
            secret_name="ZENODO_SANDBOX_API_KEY"
          fi
          if [[ -z "$token" ]]; then
            echo "Repository secret $secret_name is not configured." >&2
            exit 1
          fi
          if [[ "$token" == *$'\n'* || "$token" == *$'\r'* ]]; then
            echo "Repository secret $secret_name contains a newline; save only the raw Zenodo token." >&2
            exit 1
          fi

      - name: Select Zenodo concept
        id: concept
        env:
          REQUESTED_CONCEPT: ${{ inputs.concept_id }}
          USE_SANDBOX: ${{ inputs.sandbox }}
        run: |
          concept="$REQUESTED_CONCEPT"
          if [[ -z "$concept" ]]; then
            if [[ "$USE_SANDBOX" == "true" ]]; then
              echo "concept_id is required when using Zenodo Sandbox" >&2
              exit 1
            fi
            concept_url=$(python scripts/update_project_doi.py --key Concept_DOI)
            concept="${concept_url##*.}"
          fi
          [[ "$concept" =~ ^[0-9]+$ ]] || { echo "Invalid concept record ID" >&2; exit 1; }
          echo "id=$concept" >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft and reserve DOI
        id: draft
        env:
          CONCEPT_ID: ${{ steps.concept.outputs.id }}
          USE_SANDBOX: ${{ inputs.sandbox }}
        run: |
          sandbox_flag=()
          host="zenodo.org"
          if [[ "$USE_SANDBOX" == "true" ]]; then
            sandbox_flag=(--sandbox)
            host="sandbox.zenodo.org"
          fi

          latest_published_details() {
            records=$(curl --fail --silent --show-error --get \
              "https://$host/api/records" \
              --data-urlencode "q=conceptrecid:$CONCEPT_ID" \
              --data "sort=mostrecent" \
              --data "size=1")
            published_id=$(jq -er '.hits.hits[0].id' <<< "$records")
            zenodraft deposition show details "${sandbox_flag[@]}" "$published_id"
          }

          restore_metadata() {
            local deposition_id="$1"
            local published_details="$2"
            local metadata_file="$RUNNER_TEMP/zenodo-metadata.json"
            # DOI fields are managed by Zenodo for the new version.  All other
            # metadata, including creators and related identifiers, is cloned.
            jq '.metadata | del(.doi, .prereserve_doi)' \
              <<< "$published_details" > "$metadata_file"
            zenodraft metadata update "${sandbox_flag[@]}" \
              "$deposition_id" "$metadata_file"
          }

          draft_id=$(zenodraft deposition show draft "${sandbox_flag[@]}" "$CONCEPT_ID")
          draft_action="Reused"
          published_details=""
          if [[ -n "$draft_id" ]]; then
            details=$(zenodraft deposition show details "${sandbox_flag[@]}" "$draft_id")
            jq -e '.submitted | type == "boolean"' <<< "$details" > /dev/null || {
              echo "Zenodo returned an invalid submission state for deposition $draft_id." >&2
              exit 1
            }
            submitted=$(jq -r '.submitted' <<< "$details")
            if [[ "$submitted" == "true" ]]; then
              echo "zenodraft returned published deposition $draft_id; creating a new version instead."
              published_details="$details"
              draft_id=""
            fi
          fi
          if [[ -z "$draft_id" ]]; then
            if [[ -z "$published_details" ]]; then
              published_details=$(latest_published_details)
            fi
            draft_id=$(zenodraft deposition create version "${sandbox_flag[@]}" "$CONCEPT_ID")
            # zenodraft 0.14.1 clears metadata after Zenodo clones the record.
            # Put the latest published version's metadata back immediately.
            restore_metadata "$draft_id" "$published_details"
            draft_action="Created"
          elif jq -e '
            (.metadata.title // "" | startswith("Untitled in ")) and
            ((.metadata.creators // []) | length == 0)
          ' <<< "$details" > /dev/null; then
            echo "Repairing metadata cleared by an earlier zenodraft run."
            published_details=$(latest_published_details)
            restore_metadata "$draft_id" "$published_details"
            draft_action="Repaired"
          fi

          # Never accept a published record as the draft, even if Zenodo exposes
          # it through a latest_draft link (zenodraft does not check this state).
          details=$(zenodraft deposition show details "${sandbox_flag[@]}" "$draft_id")
          jq -e --arg concept "$CONCEPT_ID" \
            '.submitted == false and (.conceptrecid | tostring) == $concept' <<< "$details" > /dev/null || {
              echo "Deposition $draft_id is not an unpublished draft in concept $CONCEPT_ID." >&2
              exit 1
            }
          doi=$(zenodraft deposition show prereserved "${sandbox_flag[@]}" "$draft_id")
          [[ "$doi" == 10.5281/zenodo.* ]] || { echo "Unexpected DOI: $doi" >&2; exit 1; }

          echo "id=$draft_id" >> "$GITHUB_OUTPUT"
          echo "doi=$doi" >> "$GITHUB_OUTPUT"
          echo "url=https://$host/uploads/$draft_id" >> "$GITHUB_OUTPUT"
          {
            echo "### Zenodo draft"
            echo "$draft_action [draft $draft_id](https://$host/uploads/$draft_id) and reserved **$doi**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update versioned DOI
        env:
          DOI: ${{ steps.draft.outputs.doi }}
        run: python scripts/update_project_doi.py --key Versioned_DOI --value "$DOI"

      - name: Commit DOI update
        env:
          DOI: ${{ steps.draft.outputs.doi }}
        run: |
          if git diff --quiet -- pyproject.toml; then
            echo "pyproject.toml already contains $DOI"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Update versioned DOI to $DOI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
