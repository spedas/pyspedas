name: mth5_tests

on:
  push:
    paths:
      - 'pyspedas/mth5/**'
      - '.github/workflows/mth5_tests.yml'
  pull_request:
    paths:
      - 'pyspedas/mth5/**'
      - '.github/workflows/mth5_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install MTH5 dependencies
        run: python -m pip install -e ".[mth5]"
      - name: Run MTH5 tests
        run: python -m unittest discover -s pyspedas/mth5/tests -v